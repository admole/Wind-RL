# task and env
env:
  env_name: WindFarm
  dummy_update: True

# collector
collector:
  frame_skip: 1  # Env takes 50 time steps per update
  frames_per_batch: 100 # this is the actual number of frames we see in a batch
  max_episode_length: 1_000  # Timesteps (disregarding frame skip)
  total_frames: 30_000  # Timesteps (disregarding frame skip)

# logger
logger:
  backend: wandb
  mode: online
  test_interval: 5_000
  num_test_episodes: 2
  test_episode_length: 1_000
  project_name: Wind-PPO
  team_name: windrl

# Optim
optim:
  lr: 3e-4
  weight_decay: 0.0
  anneal_lr: True

# loss
loss:
  gamma: 0.99
  mini_batch_size: 25  # must be less than frames per batch
  ppo_epochs: 10
  gae_lambda: 0.95
  clip_epsilon: 0.2
  anneal_clip_epsilon: False
  critic_coef: 0.25
  entropy_coef: 0.0
  loss_critic_type: l2
