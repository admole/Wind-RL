env:
  n_parallel: 32
  n_processors_per_env: 128
  dummy_update: false
  env_name: WindFarm
  turbines: 3
  probes_per_turbine: 77
  flow_field_directions:
  - ux
  turbine_diameter: 126
  turbine_height: 90
  turbine_spacing: 5
  turbine_spacing_z: 7
  max_yaw_speed: 1.0
  max_yaw_angle: 40
  steps_per_frame: 50
  reset_frames: 150
  initial_reset_frames: 5000
  frame_stack: 1
  reward_average_steps: 1
  penalty_scale: 0.5
  penalty_exp: 26
  velocity_penalty_scale: 0.0
  difference_penalty_scale: 0.0
  random_reset: false
  initial_angles:
  - 0.0
  - 0.0
  - 0.0
multi_agent:
  use: false
collector:
  total_frames: 1000000
  init_random_frames: 32000
  max_episode_length: 500
  frames_per_batch: 1024
  device: cpu
replay_buffer:
  size: ${collector.total_frames}
  prb: false
optim:
  gamma: 0.99
  lr: 3.0e-06
  entropy_lr: 1.0e-05
  step_mult: 1
  weight_decay: 0.0
  batch_size: 256
  target_update_polyak: 0.995
  alpha_init: 10
  adam_eps: 1.0e-08
network:
  actor_hidden_depth: 2
  actor_hidden_size: 256
  critic_hidden_depth: 2
  critic_hidden_size: 256
  default_policy_scale: 1.0
  scale_lb: 0.1
  device: cpu
logger:
  logging_stream: stdout
checkpoint:
  checkpoint_interval: 50
  load_from_checkpoint: false
  model_checkpoint_path: ./training_sac_no_mult/sac/checkpoints
  model_checkpoint_id: 410624
  save_replay_buffer: true
